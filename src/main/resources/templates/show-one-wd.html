<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

    <h1>Work Description Details</h1>

    <table border="1px">
        <tr>
            <td>ID</td>
            <td th:text="${package.idkpiwd}"></td>
        </tr>
		<tr>
		    <td>User</td>
		    <td th:text="${package.User.name+' '+package.User.surname}"></td>
		</tr>
        <tr>
            <td>Date</td>
            <td th:text="${package.date}"></td>
        </tr>
        <tr>
            <td>Priority</td>
            <td th:text="${package.priority}"></td>
        </tr>
		<tr>
		    <td>Department</td>
		     <td th:text="${package.department.description}"></td>
		 </tr>
        <tr>
            <td>Description</td>
            <td th:text="${package.description}"></td>
        </tr>
    </table>

</body>

</html>
