<html xmlns:th="http://www.thymeleaf.org">

<body>
	<a th:href="@{/project/crud/all(language='lv')}">LV</a>
	<a th:href="@{/project/crud/all(language='en')}">EN</a>
	<a th:href="@{/project/crud/all(language='ru')}">RU</a>

	<h1>Edit project:</h1>
	<form method="post" th:object="${project}" th:action="@{/project/crud/update/__${id}__}">

		<p>Input project number</p>
		<input type="text" th:field="*{projectNumber}" />

		<p>Input project name</p>
		<input type="text" th:field="*{projectName}" />

		<p>Input starting date</p>
		<input type="date" th:field="*{startingDate}" />

		<p>Input ending date</p>
		<input type="date" th:field="*{endingDate}" />

		<p>Input activity</p>
		<input type="checkbox" th:field="*{active}" />

		<button type="submit">Save project</button>
	</form>
</body>

</html>
