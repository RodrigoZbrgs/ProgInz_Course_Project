<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
	<h1>Add Work Description:</h1>
	<form method="post" th:object="${workDescription}" th:action="@{/workdescriptions/crud/add}">
		<p>Input date</p>
		<input type="date" th:field="*{date}" />
		<p>Select user</p>
		<select th:field="*{user}">
		    <option th:each="u : ${users}"
		            th:value="${u.uid}"
		            th:text="${u.name + ' ' + u.surname}">
		    </option>
		</select>
		<p>Input priority</p>
		<select th:field="*{priority}">
			<option value="Low">LOW</option>
			<option value="Medium">MEDIUM</option>
			<option value="High">HIGH</option>
		</select>
		<p>Input department</p>
		<select th:field="*{department}">
			<option value="Programming">Programming</option>
			<option value="Manegment">Manegment</option>
			<option value="Workers">Workers</option>
		</select>
		<p>Input description</p>
		<input type="text" th:field="*{description}" />
		<button type="submit">Save</button>
	</form>
</body>

</html>
