<html xmlns:th="http://www.thymeleaf.org">

<body>

	<a th:href="@{/kpireal/crud/all(language='lv')}">LV</a>
	<a th:href="@{/kpireal/crud/all(language='en')}">EN</a>
	<a th:href="@{/kpireal/crud/all(language='ru')}">RU</a>

	<h1>KPI Realisation data:</h1>
	<h2 th:text="${info}"></h2>
	<table border="1px">
		<tr>
			<td>Idkpir</td>
			<td>RealisationDate</td>
			<td>TextValue</td>
			<td>Comment</td>


		</tr>
		<th:block th:each="kpirealisation : ${package}">
			<tr>
				<td th:text="${kpirealisation.idkpir}"></td>
				<td th:text="${kpirealisation.realisationdate}"></td>
				<td th:text="${kpirealisation.textvalue}"></td>
				<td th:text="${kpirealisation.comment}"></td>
			</tr>
		</th:block>
	</table>



</body>



</html>
