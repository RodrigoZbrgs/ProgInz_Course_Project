<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
	<a th:href="@{/workdescriptions/crud/list(language='lv')}">LV</a>
	<a th:href="@{/workdescriptions/crud/list(language='en')}">EN</a>
	<a th:href="@{/workdescriptions/crud/list(language='ru')}">RU</a>

	<h1>Edit Work Description:</h1>
	<form method="post" th:object="${workDescription}" th:action="@{/workdescriptions/crud/update/{id}(id=${workDescription.idkpiwd})}">
		<p>Input date</p>
		<input type="date" th:field="*{date}" />
		<p>Select user</p>
		<select th:field="*{user}">
		    <option th:each="u : ${users}"
		            th:value="${u.uid}"
		            th:text="${u.name + ' ' + u.surname}">
		    </option>
		</select>
		<p>Project name</p>
		<select th:field="*{information}">
			<option th:each="p : ${projects}"
			        th:value="${p.idpi}"
			        th:text="${p.projectName}"></option>
		</select>
		<p>Priority</p>
		<select th:field="*{priority}">
			<option value="Low">LOW</option>
			<option value="Medium">MEDIUM</option>
			<option value="High">HIGH</option>
		</select>
		<p>Department</p>
		<select th:field="*{department}">
		    <option th:each="d : ${departments}"
		            th:value="${d.did}"
		            th:text="${d.description}">
		    </option>
		</select>
		<p>Input description</p>
		<input type="text" th:field="*{description}" />
		<button type="submit">Save</button>
	</form>
</body>

</html>
